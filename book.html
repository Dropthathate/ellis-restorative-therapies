<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Session | Ellis Restorative Therapies</title>

  <!-- YOUR CSS (ONLY ONE FILE) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== NAVIGATION (EXIT POINTS) ===== -->
<header class="glass-nav">
  <h2>Ellis Restorative Therapies</h2>

  <nav>
    <a href="/">Home</a>
    <a href="/index.html">Main Site</a>
    <a href="mailto:info@yourbusiness.com">Contact</a>
  </nav>
</header>

<!-- ===== MAIN ===== -->
<main class="booking-container">

  <!-- LEFT PANEL -->
  <aside class="info-panel glass">
    <h1>Book Your Session</h1>

    <label>Session Length</label>
    <select id="f-duration">
      <option value="60">60 Minutes — $100</option>
      <option value="90">90 Minutes — $150</option>
      <option value="120">120 Minutes — $200</option>
    </select>

    <label>Client Info</label>
    <input id="f-name" type="text" placeholder="Full Name">
    <input id="f-phone" type="tel" placeholder="Phone Number">
    <input id="f-email" type="email" placeholder="Email Address">

    <p style="opacity:0.7;font-size:12px;">
      You can cancel anytime up to 24 hours before your appointment.
    </p>
  </aside>

  <!-- RIGHT PANEL -->
  <section class="calendar-panel glass">

    <!-- CALENDAR -->
    <div id="state-prompt">
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <h3 id="cal-month-label"></h3>
        <button onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekday-row">
        <span>Sun</span><span>Mon</span><span>Tue</span>
        <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>

      <div id="cal-grid"></div>
    </div>

    <!-- TIME SLOTS -->
    <div id="state-slots" style="display:none;">
      <h3 id="slot-date-header"></h3>
      <div id="slots-grid"></div>
      <button onclick="goBack()">← Back to Calendar</button>
    </div>

    <!-- CONFIRM -->
    <div id="state-form" style="display:none;">
      <h3>Confirm Booking</h3>
      <button onclick="confirmBooking()">Confirm Appointment</button>
    </div>

    <!-- SUCCESS -->
    <div id="state-success" style="display:none;">
      <h2>Booking Confirmed ✔</h2>
      <p>Redirecting you home...</p>
    </div>

  </section>
</main>

<!-- FLOATING EXIT BUTTON -->
<a href="/" class="back-home-btn">← Home</a>

<!-- ===== SCRIPT ===== -->
<script>
const grid = document.getElementById("cal-grid");
const label = document.getElementById("cal-month-label");

let current = new Date();
let selectedDate = null;

function renderCalendar() {
  grid.innerHTML = "";

  const year = current.getFullYear();
  const month = current.getMonth();

  label.textContent = current.toLocaleString("default", {
    month: "long",
    year: "numeric"
  });

  const firstDay = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    grid.innerHTML += "<div></div>";
  }

  for (let d = 1; d <= days; d++) {
    const el = document.createElement("div");
    el.textContent = d;

    el.onclick = () => {
      document.querySelectorAll("#cal-grid div")
        .forEach(e => e.classList.remove("selected-day"));

      el.classList.add("selected-day");

      selectedDate = `${month+1}/${d}/${year}`;
      showSlots();
    };

    grid.appendChild(el);
  }
}

function changeMonth(dir) {
  current.setMonth(current.getMonth() + dir);
  renderCalendar();
}

function showSlots() {
  document.getElementById("state-prompt").style.display = "none";
  document.getElementById("state-slots").style.display = "block";

  const grid = document.getElementById("slots-grid");
  grid.innerHTML = "";

  ["9:00 AM","11:00 AM","1:00 PM","3:00 PM"].forEach(time => {
    const btn = document.createElement("button");
    btn.textContent = time;

    btn.onclick = () => {
      document.getElementById("state-form").style.display = "block";
    };

    grid.appendChild(btn);
  });
}

function goBack() {
  document.getElementById("state-slots").style.display = "none";
  document.getElementById("state-prompt").style.display = "block";
}

function confirmBooking() {
  document.getElementById("state-form").style.display = "none";
  document.getElementById("state-success").style.display = "block";

  setTimeout(() => {
    window.location.href = "/";
  }, 3000);
}

renderCalendar();
</script>

</body>
</html>
