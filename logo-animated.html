<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ERT Logo Animation</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
.scene { position:relative; width:400px; height:400px; display:flex; align-items:center; justify-content:center; }
.ring { position:absolute; border-radius:50%; border:1px solid rgba(45,212,191,0.5); animation:ringPulse 3.5s ease-out infinite; pointer-events:none; }
.ring-1 { width:280px; height:280px; animation-delay:0s; }
.ring-2 { width:320px; height:320px; animation-delay:0.7s; border-color:rgba(45,212,191,0.3); }
.ring-3 { width:370px; height:370px; animation-delay:1.4s; border-color:rgba(45,212,191,0.15); }
.ring-4 { width:410px; height:410px; animation-delay:2.1s; border-color:rgba(45,212,191,0.07); }
@keyframes ringPulse { 0%{transform:scale(0.7);opacity:0} 15%{opacity:1} 100%{transform:scale(1.2);opacity:0} }
.glow-core { position:absolute; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(45,212,191,0.22) 0%,rgba(45,212,191,0.10) 40%,transparent 70%); animation:coreBreathe 4s ease-in-out infinite; pointer-events:none; }
@keyframes coreBreathe { 0%,100%{transform:scale(1);opacity:0.8} 50%{transform:scale(1.25);opacity:1} }
.logo-img { position:relative; z-index:10; width:250px; height:250px; object-fit:contain; animation:logoPulse 4s ease-in-out infinite; }
@keyframes logoPulse {
  0%,100%{ transform:scale(1); filter:drop-shadow(0 0 12px rgba(45,212,191,0.6)) drop-shadow(0 0 30px rgba(45,212,191,0.25)) drop-shadow(0 0 60px rgba(45,212,191,0.1)); }
  50%{ transform:scale(1.05); filter:drop-shadow(0 0 24px rgba(45,212,191,0.9)) drop-shadow(0 0 60px rgba(45,212,191,0.5)) drop-shadow(0 0 100px rgba(45,212,191,0.2)); }
}
.shimmer-wrap { position:absolute; z-index:11; width:250px; height:250px; overflow:hidden; border-radius:50%; pointer-events:none; }
.shimmer { position:absolute; top:-50%; left:-80%; width:45%; height:200%; background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,0.15) 50%,transparent 80%); animation:sweep 4s ease-in-out infinite; }
@keyframes sweep { 0%{transform:translateX(0);opacity:0} 5%{opacity:1} 45%{transform:translateX(550px);opacity:0} 100%{transform:translateX(550px);opacity:0} }
.spark { position:absolute; border-radius:50%; background:#2dd4bf; box-shadow:0 0 6px 2px rgba(45,212,191,0.8); animation:sparkDrift 3s ease-in-out infinite; pointer-events:none; }
.s1{width:4px;height:4px;top:52px;left:68px;animation-delay:0s;animation-duration:3.1s}
.s2{width:3px;height:3px;top:72px;right:62px;animation-delay:0.9s;animation-duration:2.7s}
.s3{width:5px;height:5px;bottom:68px;left:75px;animation-delay:1.5s;animation-duration:3.4s}
.s4{width:3px;height:3px;bottom:60px;right:70px;animation-delay:0.4s;animation-duration:2.9s}
.s5{width:4px;height:4px;top:48%;left:28px;animation-delay:1.9s;animation-duration:2.5s}
.s6{width:3px;height:3px;top:42%;right:26px;animation-delay:1.1s;animation-duration:3.2s}
.s7{width:2px;height:2px;top:30%;left:48px;animation-delay:2.3s;animation-duration:2.8s}
.s8{width:2px;height:2px;bottom:32%;right:46px;animation-delay:0.6s;animation-duration:3.6s}
@keyframes sparkDrift { 0%,100%{transform:translateY(0) scale(1);opacity:0.2} 50%{transform:translateY(-14px) scale(2);opacity:1} }
.tagline { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); white-space:nowrap; font-family:'Montserrat','Inter',Arial,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.36em; text-transform:uppercase; color:rgba(45,212,191,0.6); animation:tagPulse 4s ease-in-out infinite; }
@keyframes tagPulse { 0%,100%{opacity:0.4;letter-spacing:0.36em} 50%{opacity:0.9;letter-spacing:0.42em} }
</style>
</head>
<body>
<div class="scene">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="glow-core"></div>
  <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div>
  <div class="spark s5"></div><div class="spark s6"></div><div class="spark s7"></div><div class="spark s8"></div>
  <img class="logo-img" src="logo.png" alt="Ellis Restorative Therapies Logo" />
  <div class="shimmer-wrap"><div class="shimmer"></div></div>
  <div class="tagline">Restore &nbsp;·&nbsp; Realign &nbsp;·&nbsp; Rebuild</div>
</div>
</body>
</html>
